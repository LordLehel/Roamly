name: CI Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  frontend-checks:
    name: Frontend Linter & Formatter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Fix Frontend Formatting
        run: npx prettier --write .

      - name: Commit and Push Frontend Formatting
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: apply frontend prettier formatting'

      - name: Run Frontend Linter
        run: npm run lint

  backend-checks:
    name: Backend Linter & Formatter
    needs: frontend-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Fix Backend Formatting
        run: npx prettier --write .

      - name: Commit and Push Backend Formatting
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: apply backend prettier formatting'

      - name: Run Backend Linter
        run: npm run lint